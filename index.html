<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elders with Style | 潮嬷型公 互动小志</title>
    <!-- 引入符合 PDF 气质的 Google 字体：Bebas Neue (大号先锋标题), Space Grotesk (现代无衬线), Playfair Display (优雅手写感衬线) -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,400&family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-paper: #f2f0eb;
            --primary-black: #111111;
            --vibrant-red: #e60000;
            --halftone-pink: #ff6699;
            --border-thick: 3px solid #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--primary-black);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* 顶部 Zine 风格 Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            border-bottom: var(--border-thick);
            background-color: var(--bg-paper);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .zine-issue {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: var(--primary-black);
            line-height: 1;
        }

        .zine-issue span {
            color: var(--vibrant-red);
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--primary-black);
            padding: 0.5rem 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0px var(--primary-black);
            transition: all 0.15s ease;
            margin-left: 0.8rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--vibrant-red);
            color: #ffffff;
            border-color: var(--primary-black);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--primary-black);
        }

        /* 页面显示切换 */
        .page {
            display: none;
            padding: 3rem 2rem;
            max-width: 1280px;
            margin: 0 auto;
            animation: pageFadeIn 0.4s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 首页：1:1 还原 PDF 封面与解构文字排版 --- */
        .cover-grid {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 2rem;
            align-items: center;
            min-height: 80vh;
        }

        /* 还原 PDF Page 2 错落围绕人物的红字 "e l d e r s  w i t h  s t y l e" */
        .cover-portrait-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* 使用 SVG 绘制 PDF 中绿色大墨镜与极具个性的潮嬷头雕 */
        .portrait-svg-container {
            width: 100%;
            max-width: 420px;
            filter: drop-shadow(8px 8px 0px var(--primary-black));
            z-index: 2;
        }

        .deconstructed-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            font-family: 'Bebas Neue', sans-serif;
            color: var(--vibrant-red);
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 0.9;
        }

        /* 仿 PDF 上的分散字母效果 */
        .letter-1 { position: absolute; top: 8%; left: 5%; transform: rotate(-10deg); }
        .letter-2 { position: absolute; top: 5%; right: 10%; transform: rotate(8deg); }
        .letter-3 { position: absolute; top: 40%; left: 0%; transform: rotate(-5deg); }
        .letter-4 { position: absolute; top: 45%; right: 2%; transform: rotate(12deg); }
        .letter-5 { position: absolute; bottom: 8%; right: 15%; font-size: 6rem; transform: rotate(-3deg); }

            border: var(--border-thick);

            box-shadow
